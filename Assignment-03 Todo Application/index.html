<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignment 03 - Todo CRUD</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Assignment 03 - Simple Todo App</h1>
  
  <!-- UI Requirements: Input + Add Button + Table + Edit + Delete -->
  <div class="input-section">
    <input type="text" id="todoInput" placeholder="Enter Todo Title">
    <button onclick="createTodo()">Add Todo</button>
  </div>

  <h3>Todos List</h3>
  <table id="todoTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="todoList">
      <!-- Todos yahan show honge -->
    </tbody>
  </table>
</div>

<script src="script.js"></script>
</body>
</html>
